<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Morph FX</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div>
          <h1>Audio Morph FX</h1>
          <p>Slowed, reverb, bass, and boost controls for this tab.</p>
        </div>
        <button id="resetBtn" class="ghost">Reset</button>
      </header>

      <section class="card presets">
        <h2>Presets</h2>
        <div class="preset-grid">
          <button class="preset" data-preset="slowedReverb">Slowed &amp; Reverb</button>
          <button class="preset" data-preset="nightcore">Nightcore</button>
          <button class="preset" data-preset="clean">Clean</button>
        </div>
      </section>

      <section class="card controls">
        <div class="control">
          <label for="speed">Speed <span id="speedValue">1.00x</span></label>
          <input id="speed" type="range" min="0.5" max="2" step="0.01" />
        </div>

        <div class="control">
          <label for="reverb">Reverb <span id="reverbValue">0%</span></label>
          <input id="reverb" type="range" min="0" max="100" step="1" />
        </div>

        <div class="control">
          <label for="bass">Bass Boost <span id="bassValue">0 dB</span></label>
          <input id="bass" type="range" min="0" max="20" step="1" />
          <label class="toggle-row" for="bassToggle">
            <input id="bassToggle" type="checkbox" />
            <span class="toggle-pill"></span>
            <span class="toggle-text">Enable Bass Boost</span>
          </label>
        </div>

        <div class="control">
          <label for="volume">Volume Boost <span id="volumeValue">100%</span></label>
          <input id="volume" type="range" min="50" max="300" step="1" />
        </div>
      </section>

      <footer class="footer">
        <p id="status">Ready</p>
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
